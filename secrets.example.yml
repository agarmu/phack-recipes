---
# Copy to secrets.yml, fill in the values, then run: ansible-vault encrypt secrets.yml
secret_caddy_environment:
  # Generate bcrypt hashes with: caddy hash-password
  LOKI_OTEL_PASSWORD_HASH: ''
  LOKI_ADMIN_PASSWORD_HASH: ''
# Initializes a new Grafana database; changing this does not reset an existing account.
secret_grafana_admin_password: ''

secret_cms_config:
  auth:
    issuer: ''
    jwksUrl: ''
    allowedSubjects: []
  storage:
    endpoint: ''  # Bucket-specific HTTPS origin, without a path or query.

# Changing this password does not rotate an existing database's password.
secret_cms:
  database:
    password: ''
  storage:
    accessKeyId: ''
    secretAccessKey: ''
    # sessionToken: ''
