---
- name: Stop CMS before PostgreSQL restart
  ansible.builtin.systemd_service:
    name: cms.service
    scope: user
    state: stopped
  environment: "{{ setup_podman_environment }}"
  when: cms_enabled and not ansible_check_mode

- name: Restart CMS PostgreSQL
  ansible.builtin.systemd_service:
    name: cms-postgres.service
    scope: user
    state: restarted
  environment: "{{ setup_podman_environment }}"
  when: cms_enabled and not ansible_check_mode

- name: Restart CMS
  ansible.builtin.systemd_service:
    name: cms.service
    scope: user
    state: restarted
  environment: "{{ setup_podman_environment }}"
  when: cms_enabled and not ansible_check_mode
