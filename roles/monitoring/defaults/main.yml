---
monitoring_enabled: true
monitoring_data_dir: "{{ setup_podman_data_dir }}/monitoring"
monitoring_grafana_image: docker.io/grafana/grafana:13.2.3
monitoring_loki_image: docker.io/grafana/loki:3.7.8
monitoring_prometheus_image: docker.io/prom/prometheus:v3.15.0
monitoring_tempo_image: docker.io/grafana/tempo:3.1.0
monitoring_grafana_admin_password: "{{ secret_grafana_admin_password | default('') }}"

monitoring_grafana_datasources:
  apiVersion: 1
  datasources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: "http://loki:{{ service_ports.loki }}"
      isDefault: true
      editable: false
      jsonData:
        maxLines: 1000
    - name: Prometheus
      uid: prometheus
      type: prometheus
      access: proxy
      url: "http://prometheus:{{ service_ports.prometheus }}"
      editable: false
    - name: Tempo
      uid: tempo
      type: tempo
      access: proxy
      url: "http://tempo:{{ service_ports.tempo }}"
      editable: false

monitoring_grafana_plugins:
  apiVersion: 1
  apps:
    - type: grafana-lokioperational-app
      org_id: 1
      disabled: false

monitoring_loki_config:
  auth_enabled: false
  server:
    http_listen_address: 0.0.0.0
    http_listen_port: "{{ service_ports.loki }}"
    grpc_listen_address: 127.0.0.1
    grpc_listen_port: "{{ service_ports.loki_grpc }}"
  # Single-process query callbacks must reach the loopback-only gRPC listener.
  frontend:
    address: 127.0.0.1
  common:
    path_prefix: /loki
    replication_factor: 1
    ring:
      instance_addr: 127.0.0.1
      kvstore:
        store: inmemory
  schema_config:
    configs:
      - from: '2020-01-01'
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  storage_config:
    tsdb_shipper:
      active_index_directory: /loki/index
      cache_location: /loki/index-cache
    filesystem:
      directory: /loki/chunks
  ingester:
    wal:
      dir: /loki/wal
  compactor:
    working_directory: /loki/compactor
    retention_enabled: true
    delete_request_store: filesystem
  limits_config:
    allow_structured_metadata: true
    retention_period: 720h
    otlp_config:
      resource_attributes:
        ignore_defaults: true
        attributes_config:
          - action: index_label
            attributes:
              - service.name
              - deployment.environment.name
              - deployment.environment
  analytics:
    reporting_enabled: false
  ui:
    enabled: true
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1

monitoring_prometheus_config:
  scrape_configs: []

monitoring_tempo_config:
  server:
    http_listen_address: 0.0.0.0
    http_listen_port: "{{ service_ports.tempo }}"
    grpc_listen_port: "{{ service_ports.tempo_grpc }}"
  distributor:
    receivers:
      otlp:
        protocols:
          http:
            endpoint: "0.0.0.0:{{ service_ports.tempo_otlp }}"
  storage:
    trace:
      backend: local
      wal:
        path: /var/tempo/wal
      local:
        path: /var/tempo/blocks
  usage_report:
    reporting_enabled: false
