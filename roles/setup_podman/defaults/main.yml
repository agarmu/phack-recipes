---
setup_podman_data_dir: >-
  {{ ansible_facts.env.XDG_DATA_HOME | default(ansible_facts.user_dir ~ '/.local/share', true) }}/podman-stack
setup_podman_quadlet_dir: >-
  {{ ansible_facts.env.XDG_CONFIG_HOME | default(ansible_facts.user_dir ~ '/.config', true) }}/containers/systemd
setup_podman_runtime_dir: "{{ ansible_facts.env.XDG_RUNTIME_DIR | default('', true) }}"
setup_podman_environment:
  XDG_RUNTIME_DIR: "{{ setup_podman_runtime_dir }}"
  DBUS_SESSION_BUS_ADDRESS: "unix:path={{ setup_podman_runtime_dir }}/bus"

# Used only when Podman is missing; distribution packages supply runtime dependencies.
setup_podman_packages: >-
  {{ ['podman', 'fuse-overlayfs']
     + (['uidmap', 'dbus-user-session', 'passt'] if ansible_facts.os_family == 'Debian' else []) }}

setup_podman_container_defaults:
  state: quadlet
  quadlet_dir: "{{ setup_podman_quadlet_dir }}"
  quadlet_file_mode: "0600"
  network:
    - podman-stack
  log_driver: journald
  security_opt:
    - no-new-privileges
  quadlet_options:
    - |
      [Service]
      Restart=on-failure
      RestartSec=5
      TimeoutStartSec=900
      TimeoutStopSec=60
    - |
      [Install]
      WantedBy=default.target
